<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>嗯嗯日记 · 交互预览版</title>
<!-- 所有样式集中在 preview/preview.css，按功能分区维护 -->
<link rel="stylesheet" href="preview/preview.css">
</head>
<body>
<div class="phone">
  <div class="statusbar">
    <span id="sb-time">9:41</span>
    <span class="sb-icons">📶 WiFi 🔋</span>
  </div>
  <div class="navbar" id="navbar"></div>
  <div id="page"></div>
  <div class="tabbar" id="tabbar"></div>
  <div id="toast"></div>
  <div id="modal"></div>
  <div id="overlayRoot"></div>
  <div class="quick-mask" id="quickMask" onclick="App.closeQuick()">
    <div class="quick-panel" onclick="event.stopPropagation()">
      <div class="qp-title">快捷记录</div>
      <div class="qp-label">Bristol 类型</div>
      <div class="qp-bristol" id="quickBristol"></div>
      <div class="qp-label">时长 <span class="qp-dur" id="quickDur">5 分钟</span></div>
      <div class="qp-dur-row"><input class="qp-dur-input" id="quickDurMin" type="number" min="0" max="90" value="5" placeholder="如 12" oninput="App.quickSetDurMin(this.value)" onblur="App.quickClampDur(this)"><span class="qp-dur-unit">分钟</span></div>
      <div class="qp-presets">
        <button class="preset" data-s="120" onclick="App.quickPreset(120)">2 分钟</button>
        <button class="preset" data-s="300" onclick="App.quickPreset(300)">5 分钟</button>
        <button class="preset" data-s="600" onclick="App.quickPreset(600)">10 分钟</button>
        <button class="preset" data-s="1800" onclick="App.quickPreset(1800)">30 分钟</button>
      </div>
      <div class="qp-tip">一键快捷记录 · 其他字段按默认值：量 中 / 颜色 棕 / 心情 正常 / 症状 无</div>
      <div class="qp-actions">
        <button class="qp-btn qp-cancel" onclick="App.closeQuick()">取消</button>
        <button class="qp-btn qp-confirm" onclick="App.confirmQuick()">确认记录</button>
      </div>
    </div>
  </div>
</div>

<!--
  预览版采用「多文件」结构（原先是单个超长 preview.html）。
  本文件只负责：页面骨架 + 按顺序加载拆分后的脚本。
  目录结构、各文件职责、以及「如何追加内容」的规范见 preview/README.md
-->
<!-- 加载顺序即依赖顺序：data → chart → report → canvas → db → ui → app(核心) → pages(页面) → bootstrap(启动) -->
<script src="preview/00-data.js"></script>
<script src="preview/10-chart.js"></script>
<script src="preview/20-report.js"></script>
<script src="preview/30-canvas.js"></script>
<script src="preview/40-db.js"></script>
<script src="preview/50-ui.js"></script>
<script src="preview/60-app.js"></script>
<script src="preview/70-pages.js"></script>
<script src="preview/80-bootstrap.js"></script>
</body>
</html>
