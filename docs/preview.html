<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>嗯嗯日记 · 交互预览版</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: #17171c;
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif;
    color: #1C1C1E;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }
  .phone {
    width: 100%;
    max-width: 430px;
    height: 100vh;
    height: 100dvh;
    background: #F2F2F7;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }
  @media (min-width: 520px) {
    .phone { border-radius: 40px; box-shadow: 0 30px 90px rgba(0,0,0,.65); height: 94vh; height: 94dvh; }
  }
  .statusbar {
    background: #F2F2F7;
    padding: 10px 24px 2px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    font-weight: 600;
    flex-shrink: 0;
  }
  .sb-icons { display: flex; gap: 5px; align-items: center; font-size: 11px; }

  .navbar {
    background: #F2F2F7;
    padding: 8px 18px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }
  .nav-left { display: flex; align-items: center; gap: 8px; }
  .nav-back { font-size: 26px; color: #34C759; background: none; border: none; padding: 2px 8px 2px 0; font-weight: 600; cursor: pointer; }
  .nav-title { font-size: 32px; font-weight: 700; letter-spacing: -0.5px; }
  .nav-date { font-size: 12px; color: #8E8E93; margin-top: 2px; }
  .nav-actions { display: flex; gap: 10px; align-items: center; }
  .circle-btn {
    width: 40px; height: 40px; border-radius: 50%;
    background: #fff; border: none;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; color: #34C759; cursor: pointer;
  }
  .circle-btn:active { transform: scale(.94); background: #e6e6eb; }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: #34C759; color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 600; cursor: pointer; overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }

  #page { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 4px 16px 20px; scrollbar-width: none; }
  #page::-webkit-scrollbar { display: none; }

  .card {
    background: #fff; border-radius: 18px; padding: 20px;
    margin-bottom: 12px; cursor: pointer; transition: transform .12s, opacity .12s;
  }
  .card:active { transform: scale(.985); opacity: .9; }
  .card.flat { cursor: default; }
  .card-title { font-size: 15px; font-weight: 600; }
  .card-sub { font-size: 12px; color: #8E8E93; margin-top: 4px; }

  .hero { display: flex; flex-direction: column; align-items: center; text-align: center; }
  .hero-icon {
    width: 74px; height: 74px; border-radius: 50%;
    background: #EAF6EC; font-size: 34px;
    display: flex; align-items: center; justify-content: center;
    transition: all .3s;
  }
  .hero-icon.done { background: #34C759; color: #fff; font-size: 28px; }
  .hero-title { font-size: 17px; font-weight: 600; margin-top: 12px; }
  .hero-sub { font-size: 12px; color: #8E8E93; margin-top: 5px; }
  .btn-primary {
    margin-top: 16px; width: 100%;
    background: #34C759; color: #fff; border: none;
    border-radius: 13px; padding: 13px 0;
    font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .btn-primary:active { opacity: .85; transform: scale(.99); }
  .btn-primary:disabled { opacity: .55; }
  .link-btn { font-size: 12px; color: #34C759; margin-top: 12px; background: none; border: none; cursor: pointer; }

  .stat-row { display: flex; gap: 12px; }
  .stat { flex: 1; position: relative; }
  .stat-label { font-size: 12px; color: #8E8E93; }
  .stat-num { font-size: 26px; font-weight: 700; margin-top: 4px; }
  .stat-num .unit { font-size: 12px; color: #8E8E93; font-weight: 400; }
  .stat-arrow { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); color: #C7C7CC; font-size: 22px; }

  .trend-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .trend-tag { font-size: 11px; color: #8E8E93; }
  .bars { display: flex; align-items: flex-end; justify-content: space-between; height: 96px; padding: 0 4px; }
  .bar-item { display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }
  .bar-count { font-size: 10px; color: #34C759; font-weight: 600; }
  .bar { width: 20px; border-radius: 4px; background: #C8E6CB; min-height: 5px; }
  .bar.hot { background: #34C759; }
  .bar-day { font-size: 10px; color: #8E8E93; }

  .chart-canvas { display: block; width: 100%; }
  .chart-canvas.trend { height: 200px; }
  .trend-hint { font-size: 11px; color: #8E8E93; margin: 8px 0 4px; }
  .ring-wrap { display: flex; align-items: center; margin-top: 12px; }
  .ring-canvas { width: 130px; height: 130px; flex-shrink: 0; }
  .ring-legend { flex: 1; margin-left: 16px; }
  .legend-item { display: flex; align-items: center; margin-bottom: 7px; }
  .legend-item:last-child { margin-bottom: 0; }
  .legend-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; margin-right: 8px; }
  .legend-name { flex: 1; font-size: 12px; color: #555; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .legend-pct { width: 42px; text-align: right; font-size: 12px; color: #8E8E93; flex-shrink: 0; }
  .empty { text-align: center; color: #8E8E93; font-size: 12px; padding: 26px 0; }

  .remind { display: flex; justify-content: space-between; align-items: center; }
  .remind-main { flex: 1; }
  .remind-sub { font-size: 12px; color: #8E8E93; margin-top: 4px; }

  .switch { width: 50px; height: 30px; border-radius: 15px; background: #E5E5EA; position: relative; cursor: pointer; transition: background .2s; flex-shrink: 0; }
  .switch.on { background: #34C759; }
  .knob { position: absolute; top: 2.5px; left: 2.5px; width: 25px; height: 25px; border-radius: 50%; background: #fff; transition: left .2s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  .switch.on .knob { left: 22.5px; }

  .seg { display: flex; background: #E9E9EE; border-radius: 10px; padding: 3px; margin-bottom: 14px; }
  .seg-item { flex: 1; text-align: center; padding: 8px 0; border-radius: 8px; font-size: 13px; color: #8E8E93; cursor: pointer; transition: all .2s; }
  .seg-item.on { background: #fff; color: #1C1C1E; font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.06); }

  .metric-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
  .metric { width: calc(50% - 5px); background: #fff; border-radius: 14px; padding: 14px 16px; }
  .metric-label { font-size: 11px; color: #8E8E93; }
  .metric-num { font-size: 22px; font-weight: 700; color: #34C759; margin-top: 4px; }
  .metric-num.small { font-size: 16px; }

  .dist-item { display: flex; align-items: center; margin-top: 12px; font-size: 12px; }
  .dist-name { width: 96px; color: #555; flex-shrink: 0; }
  .dist-track { flex: 1; height: 8px; background: #F0F0F3; border-radius: 4px; margin: 0 10px; overflow: hidden; }
  .dist-fill { height: 100%; background: #34C759; border-radius: 4px; min-width: 3px; transition: width .4s; }
  .dist-pct { width: 42px; text-align: right; color: #8E8E93; flex-shrink: 0; }
  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { background: #EAF6EC; color: #2E9E4F; font-size: 12px; padding: 6px 14px; border-radius: 14px; }
  .chip.gray { background: #F0F0F3; color: #8E8E93; }

  .field { margin-bottom: 16px; }
  .label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
  .label .hint { color: #8E8E93; font-weight: 400; font-size: 11px; }
  .bristol-grid { display: flex; gap: 8px; flex-wrap: wrap; }
  .bristol-item {
    width: 56px; padding: 8px 0; border-radius: 12px;
    background: #fff; border: 2px solid #eee; text-align: center; cursor: pointer; transition: all .15s;
  }
  .bristol-item.active { border-color: #34C759; background: #EAF6EC; }
  .bristol-item .bt { font-size: 18px; font-weight: 700; color: #34C759; }
  .bristol-item .bd { font-size: 10px; color: #8E8E93; }
  .tag-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag {
    padding: 8px 16px; border-radius: 16px; background: #F0F0F3;
    color: #555; font-size: 12px; cursor: pointer; transition: all .15s;
  }
  .tag.active { background: #34C759; color: #fff; }
  input[type="text"], input[type="date"], input[type="time"], textarea, select {
    width: 100%; border: none; background: #fff; border-radius: 12px;
    padding: 12px 14px; font-size: 14px; font-family: inherit; color: #1C1C1E;
  }
  textarea { height: 72px; resize: none; }

  /* 时长：摘要 + 预设胶囊 */
  .dur-summary { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
  .dur-ico { font-size: 15px; }
  .dur-value { font-size: 19px; font-weight: 700; color: #1C1C1E; }
  .dur-max { font-size: 11px; color: #8E8E93; margin-left: auto; }
  .dur-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .dur-chip {
    padding: 8px 15px; border-radius: 16px; background: #F0F0F3;
    color: #555; font-size: 12px; cursor: pointer; transition: all .15s; user-select: none;
  }
  .dur-chip.active { background: #34C759; color: #fff; font-weight: 600; }

  /* 自定义时长：直接输入分钟数 */
  .dur-custom { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
  .dur-custom-label { font-size: 11px; color: #8E8E93; }
  .dur-input-row { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .dur-input {
    width: 92px; height: 32px; padding: 0 10px; box-sizing: border-box;
    border: 1px solid #E1E1E6; border-radius: 10px; font-size: 13px; text-align: center; color: #1C1C1E;
  }
  .dur-input-unit { font-size: 12px; color: #555; }

  /* 备注：可展开的录入入口 */
  .note-head {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 14px; border-radius: 12px; background: #F0F0F3; cursor: pointer; transition: all .15s;
  }
  .note-head.open { background: #EAF6EC; }
  .note-ico { font-size: 15px; }
  .note-title { font-size: 13px; font-weight: 600; color: #1C1C1E; }
  .note-action { margin-left: auto; font-size: 12px; color: #34C759; }
  .note-area { margin-top: 10px; height: 88px; line-height: 1.5; border: 1px solid #E1E1E6; }
  .note-foot { display: flex; justify-content: flex-end; margin-top: 6px; }
  .note-count { font-size: 11px; color: #8E8E93; }
  .note-preview {
    margin-top: 8px; font-size: 12px; color: #555; line-height: 1.5;
    background: #F7F7FA; border-radius: 10px; padding: 10px 12px;
  }

  .picker-row { display: flex; gap: 10px; }
  .picker-row input { flex: 1; }

  .cell-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 15px 0; border-bottom: 1px solid rgba(60,60,67,.08);
  }
  .cell-row:last-child { border-bottom: none; }
  .cell-label { font-size: 14px; }
  .cell-value { font-size: 14px; color: #34C759; font-weight: 600; }
  .days { display: flex; gap: 8px; }
  .day-chip {
    width: 36px; height: 36px; border-radius: 50%;
    background: #F0F0F3; color: #8E8E93; font-size: 13px;
    display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all .15s;
  }
  .day-chip.on { background: #34C759; color: #fff; font-weight: 600; }

  .list-group { margin-bottom: 18px; }
  .group-date { font-size: 12px; color: #8E8E93; margin: 0 4px 8px; }
  .list-row {
    display: flex; align-items: center; background: #fff;
    border-radius: 14px; padding: 14px 16px; margin-bottom: 8px; cursor: pointer;
  }
  .list-row:active { opacity: .85; }
  .row-time { font-size: 14px; font-weight: 600; width: 70px; }
  .row-body { flex: 1; display: flex; gap: 10px; align-items: center; }
  .row-bristol { background: #EAF6EC; color: #2E9E4F; font-size: 11px; padding: 3px 10px; border-radius: 8px; }
  .row-dur { font-size: 12px; color: #8E8E93; }
  .row-arrow { color: #C7C7CC; font-size: 18px; }

  .guide-item {
    display: flex; align-items: center; padding: 14px 0;
    border-bottom: 1px solid rgba(60,60,67,.06); cursor: pointer;
  }
  .guide-item:last-child { border-bottom: none; }
  .g-badge {
    width: 34px; height: 34px; border-radius: 50%;
    background: #EAF6EC; color: #2E9E4F; font-size: 15px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .g-info { flex: 1; margin-left: 12px; }
  .g-name { font-size: 14px; font-weight: 600; }
  .g-desc { font-size: 11px; color: #8E8E93; margin-top: 3px; line-height: 1.5; }
  .g-arrow { color: #C7C7CC; font-size: 18px; }
  .faq-item { padding: 14px 0; border-bottom: 1px solid rgba(60,60,67,.06); }
  .faq-q { display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 600; cursor: pointer; }
  .faq-a { font-size: 12px; color: #8E8E93; line-height: 1.7; margin-top: 8px; }

  .profile-head { display: flex; flex-direction: column; align-items: center; padding: 8px 0 16px; }
  .profile-avatar {
    width: 88px; height: 88px; border-radius: 50%;
    background: #EAF6EC; color: #2E9E4F; font-size: 30px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden;
  }
  .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .profile-nick { font-size: 18px; font-weight: 700; margin-top: 10px; }
  .profile-edit { font-size: 12px; color: #34C759; margin-top: 4px; background: none; border: none; cursor: pointer; }
  .mini-stat-row { display: flex; background: #fff; border-radius: 14px; padding: 14px 0; margin-bottom: 12px; }
  .mini-stat { flex: 1; text-align: center; }
  .mini-stat .n { font-size: 20px; font-weight: 700; color: #34C759; }
  .mini-stat .l { font-size: 11px; color: #8E8E93; margin-top: 2px; }

  .community-hero {
    background: linear-gradient(135deg, #34C759, #2E9E4F);
    color: #fff; border-radius: 18px; padding: 24px 20px; text-align: center; margin-bottom: 12px;
  }
  .community-hero .big { font-size: 36px; }
  .community-hero .t { font-size: 17px; font-weight: 700; margin-top: 8px; }
  .community-hero .s { font-size: 12px; opacity: .85; margin-top: 4px; }

  /* tabbar */
  .tabbar {
    background: #fff; border-top: 1px solid rgba(60,60,67,.12);
    display: flex; justify-content: space-around; padding: 6px 0 calc(6px + env(safe-area-inset-bottom));
    flex-shrink: 0;
  }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 2px; color: #8E8E93; font-size: 10px; cursor: pointer; padding: 4px 10px; border: none; background: none; }
  .tab .ic { font-size: 20px; line-height: 1; }
  .tab.active { color: #34C759; font-weight: 600; }

  /* 半屏快捷面板 */
  .quick-mask {
    position: absolute; inset: 0; background: rgba(0,0,0,.45);
    display: none; align-items: flex-end; z-index: 40;
  }
  .quick-mask.show { display: flex; }
  .quick-panel {
    width: 100%; background: #fff;
    border-radius: 20px 20px 0 0;
    padding: 12px 20px calc(18px + env(safe-area-inset-bottom));
    animation: qpUp .25s ease;
  }
  @keyframes qpUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .qp-title { font-size: 16px; font-weight: 600; text-align: center; margin-bottom: 12px; }
  .qp-label { font-size: 13px; font-weight: 600; margin: 12px 0 8px; }
  .qp-dur { color: #34C759; font-weight: 700; margin-left: 6px; }
  .qp-bristol { display: flex; justify-content: space-between; }
  .bristol-mini {
    width: 38px; height: 38px; border-radius: 11px;
    background: #fff; border: 2px solid #E5E5EA;
    color: #34C759; font-size: 17px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all .15s;
  }
  .bristol-mini.active { border-color: #34C759; background: #EAF6EC; }
  .qp-dur-row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  .qp-dur-input {
    flex: 1; height: 36px; padding: 0 12px; box-sizing: border-box;
    border: 1px solid #E1E1E6; border-radius: 10px; font-size: 14px; text-align: center; color: #1C1C1E;
  }
  .qp-dur-unit { font-size: 13px; color: #555; }
  .qp-presets { display: flex; gap: 8px; }
  .preset {
    flex: 1; padding: 9px 0; border-radius: 10px;
    background: #F0F0F3; color: #555; font-size: 12px; border: none; cursor: pointer; transition: all .15s;
  }
  .preset.on { background: #EAF6EC; color: #2E9E4F; font-weight: 600; }
  .qp-actions { display: flex; gap: 10px; margin-top: 16px; }
  .qp-btn { flex: 1; padding: 12px 0; border-radius: 12px; font-size: 14px; border: none; cursor: pointer; }
  .qp-cancel { background: #F0F0F3; color: #555; }
  .qp-confirm { background: #34C759; color: #fff; font-weight: 600; }
  .qp-confirm:active, .qp-cancel:active { opacity: .85; }

  /* toast / modal */
  #toast {
    position: absolute; left: 50%; bottom: 90px; transform: translateX(-50%) translateY(20px);
    background: rgba(20,20,24,.88); color: #fff; font-size: 13px;
    padding: 10px 20px; border-radius: 20px; opacity: 0; pointer-events: none;
    transition: all .25s; z-index: 60; white-space: nowrap; max-width: 80%; overflow: hidden; text-overflow: ellipsis;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #modal {
    position: absolute; inset: 0; background: rgba(0,0,0,.45);
    display: none; align-items: center; justify-content: center; z-index: 50; padding: 24px;
  }
  #modal.show { display: flex; }
  .modal-box { width: 300px; background: #fff; border-radius: 18px; padding: 24px 20px 18px; text-align: center; }
  .modal-title { font-size: 16px; font-weight: 700; }
  .modal-body { font-size: 13px; color: #555; line-height: 1.7; margin: 12px 0 18px; text-align: left; }
  .modal-btns { display: flex; gap: 10px; }
  .modal-btn { flex: 1; padding: 10px 0; border-radius: 12px; font-size: 14px; border: none; cursor: pointer; }
  .modal-btn.cancel { background: #F0F0F3; color: #555; }
  .modal-btn.ok { background: #34C759; color: #fff; font-weight: 600; }
  .modal-btn.danger { background: #FFF1F0; color: #E24B4A; font-weight: 600; }
  .note { font-size: 11px; color: #B25E09; text-align: center; margin-top: 12px; line-height: 1.6; }
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar">
    <span id="sb-time">9:41</span>
    <span class="sb-icons">📶 WiFi 🔋</span>
  </div>
  <div class="navbar" id="navbar"></div>
  <div id="page"></div>
  <div class="tabbar" id="tabbar"></div>
  <div id="toast"></div>
  <div id="modal"></div>
  <div class="quick-mask" id="quickMask" onclick="App.closeQuick()">
    <div class="quick-panel" onclick="event.stopPropagation()">
      <div class="qp-title">快捷记录</div>
      <div class="qp-label">Bristol 类型</div>
      <div class="qp-bristol" id="quickBristol"></div>
      <div class="qp-label">时长 <span class="qp-dur" id="quickDur">5 分钟</span></div>
      <div class="qp-dur-row"><input class="qp-dur-input" id="quickDurMin" type="number" min="0" max="90" value="5" placeholder="如 12" oninput="App.quickSetDurMin(this.value)" onblur="App.quickClampDur(this)"><span class="qp-dur-unit">分钟</span></div>
      <div class="qp-presets">
        <button class="preset" data-s="120" onclick="App.quickPreset(120)">2 分钟</button>
        <button class="preset" data-s="300" onclick="App.quickPreset(300)">5 分钟</button>
        <button class="preset" data-s="600" onclick="App.quickPreset(600)">10 分钟</button>
        <button class="preset" data-s="1800" onclick="App.quickPreset(1800)">30 分钟</button>
      </div>
      <div class="qp-actions">
        <button class="qp-btn qp-cancel" onclick="App.closeQuick()">取消</button>
        <button class="qp-btn qp-confirm" onclick="App.confirmQuick()">确认记录</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ================= 数据层（localStorage 模拟云数据库） ================= */
const LS_KEY = 'shit-diary-data';
const WEEK = ['日', '一', '二', '三', '四', '五', '六'];

const pad = (n) => (n < 10 ? '0' + n : '' + n);
const fmtDate = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const fmtHM = (d) => pad(d.getHours()) + ':' + pad(d.getMinutes());
const todayStr = () => fmtDate(new Date());
// 本周一至周日的 7 个 'YYYY-MM-DD' 字符串（周一开头）
const currentWeekDays = () => {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const offset = (today.getDay() + 6) % 7; // 距本周一的天数
  const monday = new Date(today); monday.setDate(today.getDate() - offset);
  const arr = [];
  for (let i = 0; i < 7; i++) { const d = new Date(monday); d.setDate(monday.getDate() + i); arr.push(fmtDate(d)); }
  return arr;
};
const cnToday = () => { const d = new Date(); return (d.getMonth() + 1) + '月' + d.getDate() + '日 · 周' + WEEK[d.getDay()]; };
const durText = (sec) => { if (!sec) return '—'; if (sec < 60) return sec + '秒'; const m = Math.floor(sec / 60); return sec % 60 ? m + '分' + (sec % 60) + '秒' : m + '分钟'; };
const formatDuration = (sec) => {
  if (!sec) return '未记录';
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  if (h > 0 && m > 0) return h + ' 小时 ' + m + ' 分钟';
  if (h > 0) return h + ' 小时';
  if (m > 0 && s > 0) return m + ' 分 ' + s + ' 秒';
  if (m > 0) return m + ' 分钟';
  return s + ' 秒';
};
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const DURATION_PRESETS = [
  { sec: 120, label: '2 分钟' }, { sec: 300, label: '5 分钟' }, { sec: 600, label: '10 分钟' },
  { sec: 900, label: '15 分钟' }, { sec: 1800, label: '30 分钟' }, { sec: 3600, label: '1 小时' },
  { sec: 5400, label: '1 小时 30 分钟' },
];

/* ================= 图表（与小程序 utils/chart.js 同源） ================= */
function hexA(hex, a) {
  let h = hex.replace('#', '');
  if (h.length === 3) h = h.split('').map((c) => c + c).join('');
  const r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
  return `rgba(${r},${g},${b},${a})`;
}
function roundRect(ctx, x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}
function drawTrend(ctx, w, h, opt) {
  const labels = opt.labels || [], values = opt.values || [], color = opt.color || '#34C759';
  const n = values.length; if (!n) return null;
  const showYAxis = opt.showYAxis !== false;
  const padL = showYAxis ? 28 : 10;
  const padR = 10, padT = 22, padB = 24;
  const plotW = w - padL - padR, plotH = h - padT - padB;
  let maxV = Math.max(opt.maxY || 0, ...values, 1);
  maxV = Math.ceil(maxV); if (maxV < 1) maxV = 1;
  const xAt = (i) => (n === 1 ? padL + plotW / 2 : padL + (plotW * i) / (n - 1));
  const yAt = (v) => padT + plotH * (1 - v / maxV);
  // 水平网格线（0/max 之间 3 等分）
  ctx.strokeStyle = '#ECECEF'; ctx.lineWidth = 1;
  for (let g = 0; g <= 3; g++) { const y = Math.round(padT + (plotH * g) / 3) + 0.5; ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(w - padR, y); ctx.stroke(); }
  // Y 轴刻度
  if (showYAxis) {
    ctx.fillStyle = '#8E8E93'; ctx.font = '10px sans-serif'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillText(String(maxV), padL - 5, padT + 0.5);
    ctx.fillText('0', padL - 5, padT + plotH + 0.5);
  }
  const grad = ctx.createLinearGradient(0, padT, 0, padT + plotH);
  grad.addColorStop(0, hexA(color, 0.30)); grad.addColorStop(1, hexA(color, 0.02));
  ctx.beginPath(); ctx.moveTo(xAt(0), yAt(values[0]));
  for (let i = 1; i < n; i++) ctx.lineTo(xAt(i), yAt(values[i]));
  ctx.lineTo(xAt(n - 1), padT + plotH); ctx.lineTo(xAt(0), padT + plotH); ctx.closePath();
  ctx.fillStyle = grad; ctx.fill();
  ctx.beginPath(); ctx.moveTo(xAt(0), yAt(values[0]));
  for (let i = 1; i < n; i++) ctx.lineTo(xAt(i), yAt(values[i]));
  ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke();
  // 数值标签：本周(≤7)每天全标；本月等密集场景隔一天标一个，避免拥挤
  const showAll = n <= 7;
  const labelEvery = showAll ? 1 : 2; // 隔一天展示一个
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  for (let i = 0; i < n; i++) {
    if (!(showAll || values[i] > 0)) continue;
    ctx.beginPath(); ctx.arc(xAt(i), yAt(values[i]), 2.5, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = color; ctx.stroke();
    // 仅在「隔一天」位置标数值（本周点数少仍全标）
    if (values[i] > 0 && (labelEvery === 1 || i % labelEvery === 0)) {
      ctx.fillStyle = '#1C1C1E'; ctx.font = '10px sans-serif'; ctx.fillText(String(values[i]), xAt(i), yAt(values[i]) - 8);
    }
  }
  // 选中高亮：参考线 + 大圆点 + 气泡
  if (opt.tip && opt.tip.index >= 0 && opt.tip.index < n) {
    const i = opt.tip.index; const px = xAt(i), py = yAt(values[i]);
    ctx.strokeStyle = hexA(color, 0.4); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(px, padT); ctx.lineTo(px, padT + plotH); ctx.stroke();
    ctx.beginPath(); ctx.arc(px, py, 4, 0, Math.PI * 2); ctx.fillStyle = color; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = '#fff'; ctx.stroke();
    const text = opt.tip.label || String(values[i]);
    ctx.font = '600 12px sans-serif';
    const tw = ctx.measureText(text).width;
    const bw = tw + 16, bh = 22;
    let bx = px - bw / 2; bx = Math.max(padL, Math.min(bx, w - padR - bw));
    let by = py - bh - 12; if (by < padT - 2) by = py + 12;
    roundRect(ctx, bx, by, bw, bh, 6); ctx.fillStyle = color; ctx.fill();
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(text, bx + bw / 2, by + bh / 2 + 0.5);
  }
  ctx.fillStyle = '#8E8E93'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  const labelStep = n > 14 ? Math.ceil(n / 6) : 1;
  for (let i = 0; i < n; i++) { if (n <= 14 || i % labelStep === 0 || i === n - 1) ctx.fillText(labels[i], xAt(i), h - 6); }
  const points = [];
  for (let i = 0; i < n; i++) points.push({ x: xAt(i), y: yAt(values[i]), value: values[i] });
  return { points, plot: { left: padL, right: w - padR, top: padT, bottom: padT + plotH } };
}
function drawRing(ctx, w, h, opt) {
  const segments = (opt.segments || []).filter((s) => s.value > 0);
  const total = segments.reduce((s, x) => s + x.value, 0);
  const cx = w / 2, cy = h / 2, rOuter = Math.min(w, h) / 2 - 4, rInner = rOuter * 0.62, rMid = (rOuter + rInner) / 2, thickness = rOuter - rInner;
  ctx.clearRect(0, 0, w, h);
  if (!total) {
    ctx.beginPath(); ctx.arc(cx, cy, rMid, 0, Math.PI * 2); ctx.lineWidth = thickness; ctx.strokeStyle = '#ECECEF'; ctx.stroke();
    ctx.fillStyle = '#8E8E93'; ctx.font = '12px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(opt.emptyText || '暂无数据', cx, cy); return;
  }
  let start = -Math.PI / 2;
  segments.forEach((seg) => { const ang = (seg.value / total) * Math.PI * 2; ctx.beginPath(); ctx.arc(cx, cy, rMid, start, start + ang); ctx.lineWidth = thickness; ctx.strokeStyle = seg.color; ctx.stroke(); start += ang; });
  ctx.textAlign = 'center';
  if (opt.centerTop) { ctx.fillStyle = opt.centerColor || '#1C1C1E'; ctx.font = '600 22px sans-serif'; ctx.textBaseline = 'alphabetic'; ctx.fillText(String(opt.centerTop), cx, cy + 4); }
  if (opt.centerBottom) { ctx.fillStyle = '#8E8E93'; ctx.font = '11px sans-serif'; ctx.textBaseline = 'alphabetic'; ctx.fillText(opt.centerBottom, cx, cy + 22); }
}
// 取 canvas 并按 dpr 缩放后绘制（浏览器版）
function drawCanvas2D(id, fn) {
  const el = document.getElementById(id);
  if (!el) return;
  const dpr = window.devicePixelRatio || 2;
  const w = el.clientWidth, h = el.clientHeight;
  if (!w || !h) return;
  el.width = w * dpr; el.height = h * dpr;
  const ctx = el.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fn(ctx, w, h);
}
function drawTrendCanvas() {
  const cfg = App._trendCfg; if (!cfg) return;
  drawCanvas2D('trendCanvas', (ctx, w, h) => {
    const geo = drawTrend(ctx, w, h, {
      labels: cfg.labels,
      values: cfg.values,
      color: '#34C759',
      tip: App.trendTipIndex != null ? { index: App.trendTipIndex, label: cfg.tipLabels[App.trendTipIndex] } : null,
    });
    App._trendGeo = geo;
  });
}
function renderStatsCharts() {
  const d = App.statsData(App.statsPeriod);
  App._trendCfg = { labels: d.bars.map((b) => b.day), values: d.bars.map((b) => b.count), tipLabels: d.bars.map((b) => b.tipLabel) };
  // 每次渲染默认高亮今天（切换周期/页面时重置；点击查看某天走 drawTrendCanvas 单独更新，不会被覆盖）
  const ti = d.bars.findIndex((b) => b.date === todayStr());
  App.trendTipIndex = ti >= 0 ? ti : 0;
  drawTrendCanvas();
  const total = d.dist.reduce((s, b) => s + b.count, 0);
  const dom = d.dist.slice().sort((a, b) => b.count - a.count)[0];
  drawCanvas2D('ringCanvas', (ctx, w, h) => drawRing(ctx, w, h, {
    segments: d.dist.map((b) => ({ value: b.count, color: b.color })),
    centerTop: String(total), centerBottom: '总记录', emptyText: '暂无数据',
    centerColor: dom && dom.count ? dom.color : '#1C1C1E'
  }));
}

let DB = null;
function loadDB() {
  try { DB = JSON.parse(localStorage.getItem(LS_KEY)); } catch (e) { DB = null; }
  if (!DB || !DB.records) seedDB();
}
function saveDB() { localStorage.setItem(LS_KEY, JSON.stringify(DB)); }
function seedDB() {
  const records = [];
  const now = new Date();
  // 生成近 7 天演示数据
  for (let i = 6; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i);
    const count = i === 6 ? 1 : (i % 2 === 0 ? 2 : 1);
    for (let k = 0; k < count; k++) {
      const t = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 7 + (i * 3 + k * 2) % 12, 15 + (i * 17 + k * 33) % 45);
      records.push({
        id: 'demo' + i + '_' + k,
        date: fmtDate(t), time: fmtHM(t), timestamp: t.getTime(),
        bristolType: [3, 4, 4, 4, 5, 2, 6][(i + k) % 7],
        durationSec: 180 + ((i * 90 + k * 120) % 720),
        color: COLORS[i % 4], amount: AMOUNTS[(i + k) % 3],
        symptomTags: i === 0 && k === 1 ? ['腹胀'] : (i % 4 === 0 ? ['费力'] : []),
        mood: MOODS[(i + k) % 3], note: i === 6 ? '早起的第一次，状态不错' : ''
      });
    }
  }
  DB = {
    records,
    users: { nickname: '我', avatarUrl: '', streakDays: 1, totalRecords: records.length },
    reminders: { enabled: true, time: '08:00', repeatDays: [1, 2, 3, 4, 5, 6, 0] }
  };
  saveDB();
}
function resetDB() { localStorage.removeItem(LS_KEY); seedDB(); }

/* ================= 全局工具 ================= */
let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1600);
}
let modalCb = null;
function openModal(title, body, buttons) {
  const el = document.getElementById('modal');
  el.innerHTML = '<div class="modal-box">' +
    '<div class="modal-title">' + title + '</div>' +
    '<div class="modal-body">' + body + '</div>' +
    '<div class="modal-btns">' + buttons.map((b, i) =>
      '<button class="modal-btn ' + b.cls + '" data-i="' + i + '">' + b.text + '</button>').join('') +
    '</div></div>';
  el.classList.add('show');
  modalCb = (i) => {
    el.classList.remove('show');
    const b = buttons[i];
    if (b && b.onClick) b.onClick();
  };
  el.querySelectorAll('.modal-btn').forEach((btn) => btn.addEventListener('click', () => modalCb(+btn.dataset.i)));
}
function closeModal() { document.getElementById('modal').classList.remove('show'); }

/* ================= 路由（tab + 子页栈） ================= */
const App = {
  tab: 'home',
  stack: [],          // 子页栈（history/remind/guide）
  recordForm: null,
  durationPresets: DURATION_PRESETS,
  noteExpanded: false,

  init() {
    loadDB();
    this.recordForm = {
      date: todayStr(), time: fmtHM(new Date()),
      bristolType: 4, durationSec: 300, color: '', amount: '中',
      symptomTags: [], mood: '正常', note: ''
    };
    this.renderNav();
    this.renderTabbar();
    this.render();
    setInterval(() => { document.getElementById('sb-time').textContent = fmtHM(new Date()); }, 30000);
  },

  go(tab) {
    this.stack = [];
    this.tab = tab;
    this.renderNav();
    this.render();
    this.resetScroll();
  },

  push(page) {
    this.stack.push(page);
    this.renderNav();
    this.render();
    this.resetScroll();
  },
  back() {
    this.stack.pop();
    this.renderNav();
    this.render();
    this.resetScroll();
  },

  currentPage() { return this.stack.length ? this.stack[this.stack.length - 1] : this.tab; },

  resetScroll() {
    const page = document.getElementById('page');
    if (page) page.scrollTop = 0;
  },

  renderNav() {
    const nav = document.getElementById('navbar');
    const page = this.currentPage();
    const sub = this.stack.length > 0;
    if (sub) {
      const titles = { history: '历史记录', remind: '提醒设置', guide: '新手引导' };
      nav.innerHTML = '<div class="nav-left"><button class="nav-back" onclick="App.back()">‹ 返回</button></div>' +
        '<div class="nav-title" style="font-size:18px">' + titles[page] + '</div><div class="nav-actions"></div>';
      return;
    }
    if (page === 'home') {
      nav.innerHTML = '<div><div class="nav-title">嗯嗯日记</div><div class="nav-date">' + cnToday() + '</div></div>' +
        '<div class="nav-actions">' +
        '<button class="circle-btn" onclick="App.share()">↗</button>' +
        '<div class="avatar" onclick="App.go(\'profile\')">' + avatarHtml() + '</div></div>';
    } else if (page === 'stats') {
      nav.innerHTML = '<div class="nav-title" style="font-size:24px">统计</div><div class="nav-actions"></div>';
    } else if (page === 'community') {
      nav.innerHTML = '<div class="nav-title" style="font-size:24px">广场</div><div class="nav-actions"></div>';
    } else if (page === 'profile') {
      nav.innerHTML = '<div class="nav-title" style="font-size:24px">我的</div><div class="nav-actions"></div>';
    } else if (page === 'record') {
      nav.innerHTML = '<div class="nav-title" style="font-size:24px">记录</div><div class="nav-actions"></div>';
    }
  },

  renderTabbar() {
    const el = document.getElementById('tabbar');
    if (this.stack.length) { el.innerHTML = ''; return; }
    const tabs = [
      { k: 'home', ic: '🏠', t: '首页' },
      { k: 'record', ic: '➕', t: '记录' },
      { k: 'stats', ic: '📊', t: '统计' },
      { k: 'community', ic: '👥', t: '广场' },
      { k: 'profile', ic: '👤', t: '我的' }
    ];
    el.innerHTML = tabs.map((t) =>
      '<button class="tab ' + (this.tab === t.k ? 'active' : '') + '" onclick="App.go(\'' + t.k + '\')">' +
      '<span class="ic">' + t.ic + '</span><span>' + t.t + '</span></button>').join('');
  },

  render() {
    const page = document.getElementById('page');
    const p = this.currentPage();
    page.innerHTML = this[this.renderMap[p]]();
    this.afterRender(p);
  },

  afterRender(page) {
    if (page === 'stats') {
      renderStatsCharts();
      const tc = document.getElementById('trendCanvas');
      if (tc) {
        tc.onclick = (e) => {
          const cfg = App._trendCfg;
          if (!cfg || !App._trendGeo) return;
          const rect = tc.getBoundingClientRect();
          const x = e.clientX - rect.left; // 相对画布
          let best = 0, bd = 1e9;
          App._trendGeo.points.forEach((p, i) => {
            const dd = Math.abs(p.x - x);
            if (dd < bd) { bd = dd; best = i; }
          });
          App.trendTipIndex = best;
          drawTrendCanvas();
        };
      }
    }
  },

  share() {
    toast('已复制分享卡片（演示）— 正式版调用微信分享');
  },

  /* ================= 首页 ================= */
  renderMap: { home: 'renderHome', record: 'renderRecord', stats: 'renderStats', community: 'renderCommunity', profile: 'renderProfile', history: 'renderHistory', remind: 'renderRemind', guide: 'renderGuide' },

  homeData() {
    const records = DB.records;
    const days = currentWeekDays(); // 本周一~周日
    const byDay = {};
    records.forEach((r) => { byDay[r.date] = (byDay[r.date] || 0) + 1; });
    const bars = days.map((d, i) => {
      const c = byDay[d] || 0;
      return { date: d, day: WEEK[new Date(d + 'T00:00:00').getDay()], count: c, h: Math.max(8, Math.min(80, c * 34)), hot: c >= 2 };
    });
    const todayCount = byDay[todayStr()] || 0;
    const weekTotal = records.filter((r) => days.includes(r.date)).length;
    const streak = calcStreak();
    return { days, bars, todayCount, weekTotal, streak, avgPerDay: (weekTotal / 7).toFixed(1) };
  },

  renderHome() {
    const d = this.homeData();
    const recorded = d.todayCount > 0;
    const barsHtml = d.bars.map((b) =>
      '<div class="bar-item"><span class="bar-count">' + (b.count ? b.count : '') + '</span>' +
      '<div class="bar ' + (b.hot ? 'hot' : '') + '" style="height:' + b.h + 'px"></div>' +
      '<span class="bar-day">' + b.day + '</span></div>').join('');
    return '' +
      '<div class="card hero flat">' +
        '<div class="hero-icon ' + (recorded ? 'done' : '') + '">' + (recorded ? '✓' : '💩') + '</div>' +
        '<div class="hero-title">' + (recorded ? '今日已记录 ' + d.todayCount + ' 次' : '今天还未记录') + '</div>' +
        '<div class="hero-sub">' + (recorded ? '规律打卡，从每一天开始' : '点一下，3 秒完成记录') + '</div>' +
        '<button class="btn-primary" onclick="App.openQuick()">' + (recorded ? '再记一次' : '立即记录') + '</button>' +
        '<button class="link-btn" onclick="App.go(\'record\')">需要详细记录？去记录页 ›</button>' +
      '</div>' +
      '<div class="stat-row">' +
        '<div class="card stat" onclick="App.go(\'stats\')"><div class="stat-label">连续打卡</div>' +
          '<div class="stat-num">' + d.streak + '<span class="unit"> 天</span></div><span class="stat-arrow">›</span></div>' +
        '<div class="card stat" onclick="App.go(\'stats\')"><div class="stat-label">累计记录</div>' +
          '<div class="stat-num">' + DB.records.length + '<span class="unit"> 次</span></div><span class="stat-arrow">›</span></div>' +
      '</div>' +

  /* ================= 统计 ================= */
  statsData(period) {
    const isWeek = period !== 'month';
    const days = isWeek ? currentWeekDays() : (() => {
      const now = new Date(); const y = now.getFullYear(), mo = now.getMonth();
      const dim = new Date(y, mo + 1, 0).getDate(); const a = [];
      for (let dnum = 1; dnum <= dim; dnum++) { a.push(fmtDate(new Date(y, mo, dnum))); }
      return a;
    })();
    const list = DB.records.filter((r) => days.includes(r.date));
    const byDay = {};
    list.forEach((r) => { byDay[r.date] = (byDay[r.date] || 0) + 1; });
    const bars = days.map((d) => {
      const c = byDay[d] || 0;
      const dayLabel = isWeek ? WEEK[new Date(d + 'T00:00:00').getDay()] : String(Number(d.slice(8, 10)));
      const ctxLabel = isWeek ? ('周' + dayLabel) : d.slice(5);
      return { date: d, day: dayLabel, count: c, h: Math.max(8, Math.min(80, c * 34)), hot: c >= 2, tipLabel: ctxLabel + ' · ' + c + '次' };
    });
    const total = list.length;
    const durList = list.filter((r) => r.durationSec > 0);
    const avgSec = durList.length ? durList.reduce((s, r) => s + r.durationSec, 0) / durList.length : 0;
    const ideal = list.filter((r) => r.bristolType === 4).length;
    const dist = BRISTOL.map((b) => {
      const c = list.filter((r) => r.bristolType === b.type).length;
      return { ...b, count: c, pct: total ? Math.round(c / total * 100) : 0, color: BRISTOL_COLORS[b.type] };
    });
    const symMap = {};
    list.forEach((r) => r.symptomTags.forEach((t) => { symMap[t] = (symMap[t] || 0) + 1; }));
    const symptoms = Object.keys(symMap).map((k) => ({ name: k, count: symMap[k] })).sort((a, b) => b.count - a.count).slice(0, 5);
    return { total, avgPerDay: (total / (isWeek ? 7 : new Date(new Date().getFullYear(), new Date().getMonth() + 1, 0).getDate())).toFixed(1), avgDur: avgSec ? (avgSec / 60).toFixed(1) + ' 分钟' : '—', idealPct: total ? Math.round(ideal / total * 100) + '%' : '0%', bars, dist, symptoms };
  },

        '<div class="cell-row"><span class="cell-label">提醒时间</span>' +
        '<input type="time" value="' + r.time + '" style="width:110px;text-align:right" onchange="App.remindTime=this.value"></div>' +
      '</div>' +
      '<div class="card flat"><div class="card-title" style="margin-bottom:12px">重复周期</div>' +
        '<div class="days">' + days + '</div></div>' +
      '<div class="card flat"><div class="card-title" style="margin-bottom:8px">推送方式</div>' +
        '<div class="card-sub">提醒将通过微信「服务通知」推送（演示版仅保存设置）。</div></div>' +
      '<button class="btn-primary" onclick="App.saveRemind()">保存设置</button>' +
      '<div class="note">⚠️ 演示版提醒仅保存在本地，正式版需接入微信订阅消息。</div>';
  },
  remindTime: '08:00',
  remindSwitch() { DB.reminders.enabled = !DB.reminders.enabled; saveDB(); this.render(); },
  toggleDay(k) {
    const i = DB.reminders.repeatDays.indexOf(k);
    i > -1 ? DB.reminders.repeatDays.splice(i, 1) : DB.reminders.repeatDays.push(k);
    saveDB(); this.render();
  },
  saveRemind() {
    DB.reminders.time = this.remindTime || DB.reminders.time;
    saveDB();
    toast('已保存');
    this.back();
  },

  /* ================= 引导 ================= */
  guideActive: 4,
  faqOpen: 0,
  renderGuide() {
    const bristolHtml = BRISTOL.map((b) =>
      '<div class="guide-item" onclick="App.guideActive=' + b.type + ';App.render()">' +
      '<div class="g-badge">' + b.type + '</div><div class="g-info"><div class="g-name">' + b.name + '</div>' +
      (this.guideActive === b.type ? '<div class="g-desc">' + b.desc + '</div>' : '') + '</div>' +
      '<span class="g-arrow">›</span></div>').join('');
    const faq = [
      { q: '为什么要记录排便？', a: '排便习惯是肠道健康的晴雨表。连续记录可以发现频率、形态、时间的变化规律，及时察觉异常。' },
      { q: 'Bristol 分型是什么？', a: '医学上常用的粪便形态分类（1-7 型）。4 型是理想状态；1-2 型偏便秘，6-7 型偏腹泻。' },
      { q: '多久一次算正常？', a: '正常范围是每天 3 次到每周 3 次，个体差异大。更重要的是你自己的规律是否稳定。' },
      { q: '数据会泄露吗？', a: '记录默认仅自己可见（云数据库「仅创建者可读写」），分享的内容才对外可见。' },
      { q: '这是医疗建议吗？', a: '不是。本小程序仅作记录与参考，不构成诊断或治疗建议。持续异常请及时就医。' }
    ];
    const faqHtml = faq.map((f, i) =>
      '<div class="faq-item"><div class="faq-q" onclick="App.faqOpen=' + i + ';App.render()">' +
      '<span>' + f.q + '</span><span style="color:#C7C7CC">' + (this.faqOpen === i ? '▾' : '▸') + '</span></div>' +
      (this.faqOpen === i ? '<div class="faq-a">' + f.a + '</div>' : '') + '</div>').join('');
    return '' +
      '<div class="card flat" style="background:#34C759;color:#fff;text-align:center">' +
        '<div style="font-size:17px;font-weight:700">看懂你的每一次「嗯嗯」</div>' +
        '<div style="font-size:12px;opacity:.85;margin-top:6px">3 分钟学会用 Bristol 分型读懂肠道信号</div>' +
        '<button class="btn-primary" style="margin-top:14px;background:#fff;color:#2E9E4F" onclick="App.go(\'record\')">去记录一次</button></div>' +
      '<div class="card flat"><div class="card-title" style="margin-bottom:6px">Bristol 大便分型（1-7）</div>' + bristolHtml + '</div>' +
      '<div class="card flat"><div class="card-title" style="margin-bottom:6px">常见问题</div>' + faqHtml + '</div>' +
      '<div class="note">⚠️ 本小程序数据仅作记录与参考，不构成医疗建议。持续异常请及时就医。</div>';
  }
};

/* ================= 辅助函数 ================= */
function calcStreak() {
  const set = new Set(DB.records.map((r) => r.date));
  let cur = new Date(); cur.setHours(0, 0, 0, 0);
  if (!set.has(fmtDate(cur))) cur = new Date(cur.getTime() - 86400000);
  let n = 0;
  while (set.has(fmtDate(cur))) { n++; cur = new Date(cur.getTime() - 86400000); }
  return n;
}
function fmtGroup(date) {
  const d = new Date(date + 'T00:00:00');
  return Number(date.slice(5, 7)) + '月' + Number(date.slice(8, 10)) + '日 周' + WEEK[d.getDay()];
}
function avatarHtml() {
  const u = DB.users;
  return u.avatarUrl ? '<img src="' + u.avatarUrl + '">' : u.nickname[0];
}

App.init();
</script>
