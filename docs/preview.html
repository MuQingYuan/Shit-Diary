<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>嗯嗯日记 · 交互预览版</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: #17171c;
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif;
    color: #1C1C1E;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }
  .phone {
    width: 100%;
    max-width: 430px;
    height: 100vh;
    height: 100dvh;
    background: #F2F2F7;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }
  @media (min-width: 520px) {
    .phone { border-radius: 40px; box-shadow: 0 30px 90px rgba(0,0,0,.65); height: 94vh; height: 94dvh; }
  }
  .statusbar {
    background: #F2F2F7;
    padding: 10px 24px 2px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    font-weight: 600;
    flex-shrink: 0;
  }
  .sb-icons { display: flex; gap: 5px; align-items: center; font-size: 11px; }

  .navbar {
    position: relative;
    background: #F2F2F7;
    padding: 8px 18px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }
  .nav-left { position: relative; z-index: 1; display: flex; align-items: center; gap: 8px; }
  .nav-back { font-size: 26px; color: #34C759; background: none; border: none; padding: 2px 8px 2px 0; font-weight: 600; cursor: pointer; }
  .nav-title { font-size: 32px; font-weight: 700; letter-spacing: -0.5px; }
  .nav-date { font-size: 12px; color: #8E8E93; margin-top: 2px; }
  .nav-actions { position: relative; z-index: 1; display: flex; gap: 10px; align-items: center; }
  /* 有返回按钮 / 子页 / tab 页：标题水平居中 */
  .navbar.centered .nav-title {
    position: absolute; left: 0; right: 0; top: 50%;
    transform: translateY(-50%);
    width: 100%; text-align: center;
    pointer-events: none; z-index: 0;
  }
  .circle-btn {
    width: 40px; height: 40px; border-radius: 50%;
    background: #fff; border: none;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; color: #34C759; cursor: pointer;
  }
  .circle-btn:active { transform: scale(.94); background: #e6e6eb; }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: #34C759; color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 600; cursor: pointer; overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }

  #page { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 16px 20px; scrollbar-width: none; }
  #page::-webkit-scrollbar { display: none; }

  .card {
    background: #fff; border-radius: 18px; padding: 20px;
    margin-bottom: 12px; cursor: pointer; transition: transform .12s, opacity .12s;
  }
  .card:active { transform: scale(.985); opacity: .9; }
  .card.flat { cursor: default; }
  .card-title { font-size: 15px; font-weight: 600; display: flex; align-items: center; margin-bottom: 10px; }
  .sec-ico { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 7px; background: #F0F0F3; margin-right: 7px; font-size: 12px; flex-shrink: 0; }
  .card-sub { font-size: 12px; color: #8E8E93; margin-top: 4px; }
  .stat-row { display: flex; gap: 12px; }
  .stat { flex: 1; position: relative; }
  .stat-label { font-size: 12px; color: #8E8E93; }
  .stat-num { font-size: 26px; font-weight: 700; margin-top: 4px; }
  .stat-num .unit { font-size: 12px; color: #8E8E93; font-weight: 400; }
  .stat-arrow { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); color: #C7C7CC; font-size: 22px; }
  /* ===== 肠道周报 ===== */
  .rp-hero { display: flex; flex-direction: column; align-items: center; background: linear-gradient(160deg, #34C759 0%, #2BA84B 100%); color: #fff; padding: 18px 16px 20px; }
  .hero-range { font-size: 12px; opacity: 0.92; letter-spacing: 0.5px; }
  .hero-grade { font-size: 32px; margin: 9px 0 8px; line-height: 1; }
  .ring { width: 88px; height: 88px; border-radius: 50%; background: rgba(255,255,255,0.22); display: flex; align-items: center; justify-content: center; }
  .ring-in { width: 72px; height: 72px; border-radius: 50%; background: linear-gradient(160deg, #34C759 0%, #2BA84B 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; box-shadow: inset 0 0 0 2px rgba(255,255,255,0.25); }
  .hero-score { font-size: 30px; font-weight: 700; line-height: 1; }
  .hero-score-unit { font-size: 13px; font-weight: 400; }
  .hero-score-cap { font-size: 11px; opacity: 0.9; margin-top: 2px; }
  .hero-title { font-size: 17px; font-weight: 600; margin-top: 11px; }
  .hero-comment { margin-top: 8px; font-size: 12px; line-height: 1.6; text-align: center; background: rgba(255,255,255,0.18); padding: 8px 10px; border-radius: 9px; }
  .metrics-card { padding: 4px 0; }
  .metrics { display: flex; }
  .metric { flex: 1; position: relative; display: flex; flex-direction: column; align-items: center; padding: 12px 0; }
  .metric:not(:last-child)::after { content: ''; position: absolute; right: 0; top: 12px; bottom: 12px; width: 1px; background: #ECECEF; }
  .metric-num { font-size: 19px; font-weight: 700; }
  .metric-unit { font-size: 11px; color: #8E8E93; font-weight: 400; }
  .metric-label { margin-top: 4px; font-size: 11px; color: #8E8E93; }
  .dist-row { display: flex; align-items: center; margin-bottom: 10px; }
  .dist-row:last-child { margin-bottom: 0; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; margin-right: 8px; }
  .dist-name { width: 88px; font-size: 12px; color: #1C1C1E; flex-shrink: 0; }
  .dist-bar { flex: 1; height: 8px; background: #F0F0F3; border-radius: 4px; overflow: hidden; }
  .dist-fill { height: 100%; border-radius: 4px; }
  .dist-pct { width: 36px; text-align: right; font-size: 11px; color: #8E8E93; flex-shrink: 0; margin-left: 6px; }
  .cols { display: flex; gap: 12px; }
  .col { flex: 1; }
  .tag-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; gap: 4px; }
  .tag-row:last-child { margin-bottom: 0; }
  .tag { font-size: 12px; color: #1C1C1E; background: #F0F0F3; padding: 4px 9px; border-radius: 999px; flex-shrink: 0; }
  .tag-count { font-size: 11px; color: #8E8E93; flex-shrink: 0; }
  .week { display: flex; justify-content: space-between; }
  .wday { width: 38px; height: 52px; border-radius: 10px; background: #F2F2F7; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border: 1px solid transparent; }
  .wday.on { background: #EAF6EC; border-color: rgba(52,199,89,0.35); }
  .wemoji { font-size: 15px; line-height: 1; }
  .wlabel { font-size: 10px; color: #C7C7CC; }
  .wday.on .wlabel { color: #34C759; }
  .tip { display: flex; align-items: flex-start; margin-bottom: 8px; }
  .tip:last-child { margin-bottom: 0; }
  .tip-dot { color: #34C759; font-weight: 700; margin-right: 6px; line-height: 1.6; }
  .tip-text { flex: 1; font-size: 12px; color: #1C1C1E; line-height: 1.6; }
  .share-canvas { width: 100%; height: 770px; border-radius: 12px; background: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.06); }
  .btn-save { margin-top: 12px; width: 100%; background: #34C759; color: #fff; font-size: 15px; font-weight: 500; border: none; border-radius: 13px; padding: 11px 0; cursor: pointer; }
  .btn-save:active { opacity: 0.85; }
  .btn-gen { width: 100%; background: #34C759; color: #fff; font-size: 15px; font-weight: 500; border: none; border-radius: 13px; padding: 13px 0; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .btn-gen-ico { font-size: 16px; }
  .gen-loading { display: flex; flex-direction: column; align-items: center; padding: 22px 0; }
  .spinner { width: 24px; height: 24px; border-radius: 50%; border: 2px solid rgba(52,199,89,0.22); border-top-color: #34C759; animation: spin 0.8s linear infinite; }
  .gen-loading-text { margin-top: 9px; font-size: 12px; color: #8E8E93; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .share-fade { animation: fadeUp 0.42s ease both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(9px); } to { opacity: 1; transform: translateY(0); } }

  .hero { display: flex; flex-direction: column; align-items: center; text-align: center; }
  .hero-icon {
    width: 74px; height: 74px; border-radius: 50%;
    background: #EAF6EC; font-size: 34px;
    display: flex; align-items: center; justify-content: center;
    transition: all .3s;
  }
  .hero-icon.done { background: #34C759; color: #fff; font-size: 28px; }
  .hero-title { font-size: 17px; font-weight: 600; margin-top: 12px; }
  .hero-sub { font-size: 12px; color: #8E8E93; margin-top: 5px; }
  .btn-primary {
    margin-top: 16px; width: 100%;
    background: #34C759; color: #fff; border: none;
    border-radius: 13px; padding: 13px 0;
    font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .btn-primary:active { opacity: .85; transform: scale(.99); }
  .btn-primary:disabled { opacity: .55; }
  .link-btn { font-size: 12px; color: #34C759; margin-top: 12px; background: none; border: none; cursor: pointer; }

  .trend-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .trend-tag { font-size: 11px; color: #8E8E93; }
  .bars { display: flex; align-items: flex-end; justify-content: space-between; height: 96px; padding: 0 4px; }
  .bar-item { display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }
  .bar-count { font-size: 10px; color: #34C759; font-weight: 600; }
  .bar { width: 20px; border-radius: 4px; background: #C8E6CB; min-height: 5px; }
  .bar.hot { background: #34C759; }
  .bar-day { font-size: 10px; color: #8E8E93; }

  .chart-canvas { display: block; width: 100%; }
  .chart-canvas.trend { height: 200px; }
  .trend-hint { font-size: 11px; color: #8E8E93; margin: 8px 0 4px; }
  .ring-wrap { display: flex; align-items: center; margin-top: 12px; }
  .ring-canvas { width: 130px; height: 130px; flex-shrink: 0; }
  .ring-legend { flex: 1; margin-left: 16px; }
  .legend-item { display: flex; align-items: center; margin-bottom: 7px; }
  .legend-item:last-child { margin-bottom: 0; }
  .legend-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; margin-right: 8px; }
  .legend-name { flex: 1; font-size: 12px; color: #555; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .legend-pct { width: 42px; text-align: right; font-size: 12px; color: #8E8E93; flex-shrink: 0; }
  .empty { text-align: center; color: #8E8E93; font-size: 12px; padding: 26px 0; }

  .remind { display: flex; justify-content: space-between; align-items: center; }
  .remind-main { flex: 1; }
  .remind-sub { font-size: 12px; color: #8E8E93; margin-top: 4px; }

  .switch { width: 50px; height: 30px; border-radius: 15px; background: #E5E5EA; position: relative; cursor: pointer; transition: background .2s; flex-shrink: 0; }
  .switch.on { background: #34C759; }
  .knob { position: absolute; top: 2.5px; left: 2.5px; width: 25px; height: 25px; border-radius: 50%; background: #fff; transition: left .2s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  .switch.on .knob { left: 22.5px; }

  .seg { display: flex; background: #E9E9EE; border-radius: 10px; padding: 3px; margin-bottom: 14px; }
  .seg-item { flex: 1; text-align: center; padding: 8px 0; border-radius: 8px; font-size: 13px; color: #8E8E93; cursor: pointer; transition: all .2s; }
  .seg-item.on { background: #fff; color: #1C1C1E; font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.06); }

  .metric-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
  .metric { width: calc(50% - 5px); background: #fff; border-radius: 14px; padding: 14px 16px; }
  .metric-label { font-size: 11px; color: #8E8E93; }
  .metric-num { font-size: 22px; font-weight: 700; color: #34C759; margin-top: 4px; }
  .metric-num.small { font-size: 16px; }

  .dist-item { display: flex; align-items: center; margin-top: 12px; font-size: 12px; }
  .dist-name { width: 96px; color: #555; flex-shrink: 0; }
  .dist-track { flex: 1; height: 8px; background: #F0F0F3; border-radius: 4px; margin: 0 10px; overflow: hidden; }
  .dist-fill { height: 100%; background: #34C759; border-radius: 4px; min-width: 3px; transition: width .4s; }
  .dist-pct { width: 42px; text-align: right; color: #8E8E93; flex-shrink: 0; }
  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { background: #EAF6EC; color: #2E9E4F; font-size: 12px; padding: 6px 14px; border-radius: 14px; }
  .chip.gray { background: #F0F0F3; color: #8E8E93; }

  .field { margin-bottom: 16px; }
  .label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
  .label .hint { color: #8E8E93; font-weight: 400; font-size: 11px; }
  .bristol-grid { display: flex; gap: 8px; flex-wrap: wrap; }
  .bristol-item {
    width: 56px; padding: 8px 0; border-radius: 12px;
    background: #fff; border: 2px solid #eee; text-align: center; cursor: pointer; transition: all .15s;
  }
  .bristol-item.active { border-color: #34C759; background: #EAF6EC; }
  .bristol-item .bt { font-size: 18px; font-weight: 700; color: #34C759; }
  .bristol-item .bd { font-size: 10px; color: #8E8E93; }
  .tag-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag {
    padding: 8px 16px; border-radius: 16px; background: #F0F0F3;
    color: #555; font-size: 12px; cursor: pointer; transition: all .15s;
  }
  .tag.active { background: #34C759; color: #fff; }
  input[type="text"], input[type="date"], input[type="time"], textarea, select {
    width: 100%; border: none; background: #fff; border-radius: 12px;
    padding: 12px 14px; font-size: 14px; font-family: inherit; color: #1C1C1E;
  }
  textarea { height: 72px; resize: none; }

  /* 时长：摘要 + 预设胶囊 */
  .dur-summary { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
  .dur-ico { font-size: 15px; }
  .dur-value { font-size: 19px; font-weight: 700; color: #1C1C1E; }
  .dur-max { font-size: 11px; color: #8E8E93; margin-left: auto; }
  .dur-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .dur-chip {
    padding: 8px 15px; border-radius: 16px; background: #F0F0F3;
    color: #555; font-size: 12px; cursor: pointer; transition: all .15s; user-select: none;
  }
  .dur-chip.active { background: #34C759; color: #fff; font-weight: 600; }

  /* 自定义时长：直接输入分钟数 */
  .dur-custom { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
  .dur-custom-label { font-size: 11px; color: #8E8E93; }
  .dur-input-row { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .dur-input {
    width: 92px; height: 32px; padding: 0 10px; box-sizing: border-box;
    border: 1px solid #E1E1E6; border-radius: 10px; font-size: 13px; text-align: center; color: #1C1C1E;
  }
  .dur-input-unit { font-size: 12px; color: #555; }

  /* 备注：可展开的录入入口 */
  .note-head {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 14px; border-radius: 12px; background: #F0F0F3; cursor: pointer; transition: all .15s;
  }
  .note-head.open { background: #EAF6EC; }
  .note-ico { font-size: 15px; }
  .note-title { font-size: 13px; font-weight: 600; color: #1C1C1E; }
  .note-action { margin-left: auto; font-size: 12px; color: #34C759; }
  .note-area { margin-top: 10px; height: 88px; line-height: 1.5; border: 1px solid #E1E1E6; }
  .note-foot { display: flex; justify-content: flex-end; margin-top: 6px; }
  .note-count { font-size: 11px; color: #8E8E93; }
  .note-preview {
    margin-top: 8px; font-size: 12px; color: #555; line-height: 1.5;
    background: #F7F7FA; border-radius: 10px; padding: 10px 12px;
  }

  .picker-row { display: flex; gap: 10px; }
  .picker-row input { flex: 1; }

  .cell-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 15px 0; border-bottom: 1px solid rgba(60,60,67,.08);
  }
  .cell-row:last-child { border-bottom: none; }
  .cell-label { font-size: 14px; }
  .cell-value { font-size: 14px; color: #34C759; font-weight: 600; }
  .days { display: flex; gap: 8px; }
  .day-chip {
    width: 36px; height: 36px; border-radius: 50%;
    background: #F0F0F3; color: #8E8E93; font-size: 13px;
    display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all .15s;
  }
  .day-chip.on { background: #34C759; color: #fff; font-weight: 600; }

  .list-group { margin-bottom: 18px; }
  /* 年份筛选条（常驻顶部，随列表滚动吸顶） */
  .hist-years {
    position: sticky; top: 0; z-index: 6;
    display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
    padding: 10px 0 8px; margin-bottom: 4px;
    background: #F2F2F7;
  }
  .hist-years::-webkit-scrollbar { display: none; }
  .hist-year {
    flex: 0 0 auto;
    padding: 6px 16px; border-radius: 999px;
    background: #fff; color: #1C1C1E; font-size: 13px; cursor: pointer;
    transition: background .15s, color .15s;
  }
  .hist-year.on { background: #34C759; color: #fff; font-weight: 600; }
  .hist-year:active { opacity: .8; }
  .hist-total { font-size: 12px; color: #8E8E93; margin: 0 4px 10px; }
  .hist-list { padding-bottom: 8px; }
  .group-head {
    display: flex; align-items: center; justify-content: space-between;
    margin: 0 4px 8px; cursor: pointer;
  }
  .group-head:active { opacity: .8; }
  .group-right { display: flex; align-items: center; gap: 8px; }
  .group-toggle {
    width: 10px; height: 10px;
    border-right: 2px solid #8E8E93; border-bottom: 2px solid #8E8E93;
    transform: rotate(45deg); transition: transform .2s ease; margin-bottom: 3px;
  }
  .group-toggle.collapsed { transform: rotate(-135deg); }
  .group-date { font-size: 14px; font-weight: 600; color: #1C1C1E; }
  .group-count {
    font-size: 11px; color: #8E8E93; background: #E9E9EE;
    padding: 2px 10px; border-radius: 999px;
  }
  .list-bottom { text-align: center; color: #C7C7CC; font-size: 12px; padding: 14px 0 4px; }
  .list-row {
    display: flex; align-items: center; background: #fff;
    border-radius: 14px; padding: 14px 16px; margin-bottom: 8px; cursor: pointer;
  }
  .list-row:active { opacity: .85; }
  .row-time { font-size: 14px; font-weight: 600; width: 70px; }
  .row-body { flex: 1; display: flex; gap: 10px; align-items: center; }
  .row-bristol { background: #EAF6EC; color: #2E9E4F; font-size: 11px; padding: 3px 10px; border-radius: 8px; }
  .row-dur { font-size: 12px; color: #8E8E93; }
  .row-arrow { color: #C7C7CC; font-size: 18px; }

  .guide-item {
    display: flex; align-items: center; padding: 14px 0;
    border-bottom: 1px solid rgba(60,60,67,.06); cursor: pointer;
  }
  .guide-item:last-child { border-bottom: none; }
  .g-badge {
    width: 34px; height: 34px; border-radius: 50%;
    background: #EAF6EC; color: #2E9E4F; font-size: 15px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .g-info { flex: 1; margin-left: 12px; }
  .g-name { font-size: 14px; font-weight: 600; }
  .g-desc { font-size: 11px; color: #8E8E93; margin-top: 3px; line-height: 1.5; }
  .g-arrow { color: #C7C7CC; font-size: 18px; }
  .faq-item { padding: 14px 0; border-bottom: 1px solid rgba(60,60,67,.06); }
  .faq-q { display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 600; cursor: pointer; }
  .faq-a { font-size: 12px; color: #8E8E93; line-height: 1.7; margin-top: 8px; }

  .profile-head { display: flex; flex-direction: column; align-items: center; padding: 8px 0 16px; }
  .profile-avatar {
    width: 88px; height: 88px; border-radius: 50%;
    background: #EAF6EC; color: #2E9E4F; font-size: 30px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden;
  }
  .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }

  if (r.daysRecorded === 7) return '七日全勤！规律的你，连肠道都给你点赞 💪';
  if (r.score >= 90) return '肠道状态拉满，你就是本周的顺滑本滑 👑';

  if (r.daysRecorded < 4) return '本周打卡偏少，固定时间如厕能帮肠道建立生物钟 ⏰';

}
function buildTips(r) {
  const tips = [];
  if (r.bestType <= 2) tips.push('便便偏硬：每天喝够 1.5L 水，多吃燕麦、西兰花、火龙果等膳食纤维。');
  if (r.bestType >= 6) tips.push('偏稀溏：注意腹部保暖，少吃生冷油腻，温粥养肠最舒服。');
  if (r.avgDurSec > 480) tips.push('蹲坑别带手机：控制在 5 分钟内，减少久坐给直肠的压力。');
  const real = r.symptomTop.filter((s) => s.name === '出血' || s.name === '疼痛');
  if (real.length) tips.push('出现出血 / 疼痛请及时线下就医，记录只是帮你看趋势，别硬扛。');
  if (r.daysRecorded < 5) tips.push('建立如厕生物钟：每天固定时段（如晨起后）蹲 5 分钟，比偶尔猛补更有效。');
  if (tips.length < 2) tips.push('均衡饮食 + 规律作息是肠道最好的朋友，记录本身就是改变的开始。');
  if (tips.length < 3) tips.push('把「嗯嗯日记」当成每日小仪式，连续打卡 7 天解锁更多彩蛋 🎁。');
  return tips.slice(0, 3);
}
function buildWeekReport(records, opts) {
  const weekDays = opts.weekDays, streak = opts.streak || 0, list = records || [];
  const countByDay = {};
  list.forEach((r) => { countByDay[r.date] = (countByDay[r.date] || 0) + 1; });
  const weekDots = weekDays.map((d) => {
    const date = fmtDate(d), c = countByDay[date] || 0;
    return { date, label: ['一', '二', '三', '四', '五', '六', '日'][(d.getDay() + 6) % 7], recorded: c > 0, count: c, emoji: c > 0 ? '💩' : '·' };
  });
  const daysRecorded = weekDots.filter((x) => x.recorded).length;
  const total = list.length;
  const durList = list.filter((r) => r.durationSec > 0);
  const avgDurSec = durList.length ? Math.round(durList.reduce((s, r) => s + r.durationSec, 0) / durList.length) : 0;
  const ideal = list.filter((r) => Number(r.bristolType) === 4).length;
  const idealPct = total ? Math.round((ideal / total) * 100) : 0;
  const bristolDist = BRISTOL.map((b) => {
    const c = list.filter((r) => Number(r.bristolType) === b.type).length;
    return { type: b.type, name: bristolName(b.type), count: c, pct: total ? Math.round((c / total) * 100) : 0, color: BRISTOL_COLORS[b.type] };
  }).filter((x) => x.count > 0).sort((a, b) => b.count - a.count);
  const bestType = bristolDist.length ? bristolDist[0].type : 0;
  const symMap = {};
  list.forEach((r) => (r.symptomTags || []).forEach((t) => { if (t && t !== '无') symMap[t] = (symMap[t] || 0) + 1; }));
  const symptomTop = Object.keys(symMap).map((k) => ({ name: k, count: symMap[k] })).sort((a, b) => b.count - a.count).slice(0, 3);
  const moodMap = {};
  list.forEach((r) => { const m = r.mood || '正常'; moodMap[m] = (moodMap[m] || 0) + 1; });
  const moodAgg = ['轻松', '正常', '不适'].filter((m) => moodMap[m]).map((m) => ({ name: m, count: moodMap[m], pct: total ? Math.round((moodMap[m] / total) * 100) : 0 }));
  const regularity = daysRecorded / 7, idealRatio = idealPct / 100;
  const durScore = avgDurSec ? Math.max(0, Math.min(1, 1 - Math.abs(avgDurSec - 330) / 330)) : 0.6;
  const realSym = list.filter((r) => (r.symptomTags || []).some((t) => t && t !== '无')).length;
  const symScore = total ? Math.max(0, 1 - realSym / total) : 0.6;
  const score = total === 0 ? 0 : Math.round((regularity * 0.40 + idealRatio * 0.30 + durScore * 0.15 + symScore * 0.15) * 100);
  const grade = gradeOf(score);
  const comment = scoreComment({ total, daysRecorded, score, idealPct, bestType, avgDurSec, symptomTop });
  const tips = buildTips({ bestType, avgDurSec, daysRecorded, symptomTop });
  const first = weekDays[0], last = weekDays[6];
  const rangeLabel = (first.getMonth() + 1) + '/' + first.getDate() + ' - ' + (last.getMonth() + 1) + '/' + last.getDate();
  return { rangeLabel, daysRecorded, total, streak, score, grade, avgDurSec, avgDurText: durText(avgDurSec), idealPct, bristolDist, bestType, bestTypeName: bestType ? bristolName(bestType) : '—', symptomTop, moodAgg, weekDots, comment, tips };
}
function sectionTitle(ctx, text, x, y, color) {
  ctx.save();
  ctx.fillStyle = color;
  roundRect(ctx, x, y - 15, 6, 19, 3); ctx.fill();
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#1C1C1E'; ctx.font = '600 18px sans-serif'; ctx.fillText(text, x + 16, y);
  ctx.restore();
}
function drawReportCard(ctx, w, h, r) {
  const g = r.grade;
  ctx.clearRect(0, 0, w, h);
  const R = 28;
  roundRect(ctx, 0, 0, w, h, R); ctx.fillStyle = '#FFFFFF'; ctx.fill();
  const PAD = 32;
  // 顶部渐变头（段位配色）
  ctx.save(); roundRect(ctx, 0, 0, w, h, R); ctx.clip();
  const grad = ctx.createLinearGradient(0, 0, w, 190);
  grad.addColorStop(0, g.grad[0]); grad.addColorStop(1, g.grad[1]);
  ctx.fillStyle = grad; ctx.fillRect(0, 0, w, 178); ctx.restore();
  // 头文字
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = '#FFFFFF';
  ctx.font = '700 26px sans-serif'; ctx.fillText('我的肠道周报', PAD, 50);
  ctx.font = '400 16px sans-serif'; ctx.globalAlpha = 0.9; ctx.fillText(r.rangeLabel + ' · 本周', PAD, 80); ctx.globalAlpha = 1;
  ctx.textAlign = 'right';
  ctx.font = '42px sans-serif'; ctx.fillText(g.emoji, w - PAD, 82);
  ctx.font = '700 19px sans-serif'; ctx.fillText(g.title, w - PAD, 116);
  ctx.font = '400 12px sans-serif'; ctx.globalAlpha = 0.85; ctx.fillText('本周段位', w - PAD, 136); ctx.globalAlpha = 1;
  // 评分圆环（优雅：柔光轨道 + 段位渐变弧 + 圆角端点）
  const cx = w / 2, cy = 250, rad = 56;
  const ang = (r.score / 100) * Math.PI * 2;
  ctx.save();
  ctx.shadowColor = g.color; ctx.shadowBlur = 12; ctx.lineWidth = 14; ctx.strokeStyle = '#F1F1F4';
  ctx.beginPath(); ctx.arc(cx, cy, rad, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
  const ag = ctx.createLinearGradient(cx - rad, cy - rad, cx + rad, cy + rad);
  ag.addColorStop(0, g.grad[0]); ag.addColorStop(1, g.grad[1]);
  ctx.lineWidth = 14; ctx.strokeStyle = ag; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(cx, cy, rad, -Math.PI / 2, -Math.PI / 2 + ang); ctx.stroke(); ctx.lineCap = 'butt';
  ctx.fillStyle = '#1C1C1E'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.font = '700 40px sans-serif'; ctx.fillText(String(r.score), cx, cy + 2);
  ctx.fillStyle = '#8E8E93'; ctx.font = '400 13px sans-serif'; ctx.fillText('肠道健康分', cx, cy + 26);
  // 关键指标（值自动缩放，避免超出卡片背景）
  let y = 326;
  const chips = [{ k: '打卡', v: r.daysRecorded + '/7' }, { k: '时长', v: r.avgDurText }, { k: '理想', v: r.idealPct + '%' }];
  const cw = (w - PAD * 2 - 24) / 3;
  const fitVal = (val, cxx, yy, maxW) => {
    let fs = 22; ctx.font = '700 ' + fs + 'px sans-serif';
    const tw = ctx.measureText(val).width;
    if (tw > maxW) { fs = Math.max(13, Math.floor((fs * maxW) / tw)); ctx.font = '700 ' + fs + 'px sans-serif'; }
    ctx.fillText(val, cxx, yy);
  };
  chips.forEach((c, i) => {
    const x = PAD + i * (cw + 12);
    roundRect(ctx, x, y, cw, 72, 16); ctx.fillStyle = g.soft; ctx.fill();
    ctx.fillStyle = '#1C1C1E'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    fitVal(c.v, x + cw / 2, y + 38, cw - 14);
    ctx.fillStyle = '#8E8E93'; ctx.font = '400 13px sans-serif'; ctx.fillText(c.k, x + cw / 2, y + 58);
  });
  // 本周点评（紧凑气泡，2 行内）
  y += 72 + 20; const bubbleH = 84;
  roundRect(ctx, PAD, y, w - PAD * 2, bubbleH, 16); ctx.fillStyle = g.soft; ctx.fill();
  ctx.fillStyle = g.color; ctx.font = '600 14px sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.fillText('本周点评', PAD + 16, y + 26);
  ctx.fillStyle = '#3A3A3A'; ctx.font = '400 14px sans-serif'; wrapText(ctx, r.comment, PAD + 16, y + 48, w - PAD * 2 - 32, 19, 2);
  // 肠道小贴士（最多 2 条，完整展示，不省略）
  y += bubbleH + 20; sectionTitle(ctx, '💡 肠道小贴士', PAD, y, g.color); y += 24;
  ctx.font = '400 13.5px sans-serif';
  r.tips.slice(0, 2).forEach((t) => { y = wrapText(ctx, '· ' + t, PAD, y, w - PAD * 2, 19, 4) + 9; });
  // 页脚
  ctx.fillStyle = '#C7C7CC'; ctx.font = '400 12px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('嗯嗯日记 · 数据来自你自己的记录', w / 2, h - 18);
}

// 取 canvas 并按 dpr 缩放后绘制（浏览器版）
function drawCanvas2D(id, fn) {
  const el = document.getElementById(id);
  if (!el) return;
  const dpr = window.devicePixelRatio || 2;
  const w = el.clientWidth, h = el.clientHeight;
  if (!w || !h) return;
  el.width = w * dpr; el.height = h * dpr;
  const ctx = el.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fn(ctx, w, h);
}
function drawTrendCanvas() {
  const cfg = App._trendCfg; if (!cfg) return;
  drawCanvas2D('trendCanvas', (ctx, w, h) => {
    const geo = drawTrend(ctx, w, h, {
      labels: cfg.labels,
      values: cfg.values,
      color: '#34C759',
      tip: App.trendTipIndex != null ? { index: App.trendTipIndex, label: cfg.tipLabels[App.trendTipIndex] } : null,
    });
    App._trendGeo = geo;
  });
}
function renderStatsCharts() {
  const d = App.statsData(App.statsPeriod);
  App._trendCfg = { labels: d.bars.map((b) => b.day), values: d.bars.map((b) => b.count), tipLabels: d.bars.map((b) => b.tipLabel) };
  // 每次渲染默认高亮今天（切换周期/页面时重置；点击查看某天走 drawTrendCanvas 单独更新，不会被覆盖）
  const ti = d.bars.findIndex((b) => b.date === todayStr());
  App.trendTipIndex = ti >= 0 ? ti : 0;
  drawTrendCanvas();
  const total = d.dist.reduce((s, b) => s + b.count, 0);
  const dom = d.dist.slice().sort((a, b) => b.count - a.count)[0];
  drawCanvas2D('ringCanvas', (ctx, w, h) => drawRing(ctx, w, h, {
    segments: d.dist.map((b) => ({ value: b.count, color: b.color })),
    centerTop: String(total), centerBottom: '总记录', emptyText: '暂无数据',
    centerColor: dom && dom.count ? dom.color : '#1C1C1E'
  }));
}

let DB = null;
function loadDB() {
  try { DB = JSON.parse(localStorage.getItem(LS_KEY)); } catch (e) { DB = null; }
  if (!DB || !DB.records) seedDB();
}
function saveDB() { localStorage.setItem(LS_KEY, JSON.stringify(DB)); }
function seedDB() {
  const records = [];
  const now = new Date();
  // 生成近 7 天演示数据
  for (let i = 6; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i);
    const count = i === 6 ? 1 : (i % 2 === 0 ? 2 : 1);
    for (let k = 0; k < count; k++) {
      const t = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 7 + (i * 3 + k * 2) % 12, 15 + (i * 17 + k * 33) % 45);
      records.push({
        id: 'demo' + i + '_' + k,
        date: fmtDate(t), time: fmtHM(t), timestamp: t.getTime(),
        bristolType: [3, 4, 4, 4, 5, 2, 6][(i + k) % 7],
        durationSec: 180 + ((i * 90 + k * 120) % 720),
        color: COLORS[i % 4], amount: AMOUNTS[(i + k) % 3],
        symptomTags: i === 0 && k === 1 ? ['腹胀'] : (i % 4 === 0 ? ['费力'] : []),
        mood: MOODS[(i + k) % 3], note: i === 6 ? '早起的第一次，状态不错' : ''
      });
    }
  }
  DB = {
    records,
    users: { nickname: '我', avatarUrl: '', streakDays: 1, totalRecords: records.length },
    reminders: { enabled: true, time: '08:00', repeatDays: [1, 2, 3, 4, 5, 6, 0] }
  };
  saveDB();
}
function resetDB() { localStorage.removeItem(LS_KEY); seedDB(); }

  /* ================= 统计 ================= */
  statsData(period) {
    const isWeek = period !== 'month';
    const days = isWeek ? currentWeekDays() : (() => {
      const now = new Date(); const y = now.getFullYear(), mo = now.getMonth();
      const dim = new Date(y, mo + 1, 0).getDate(); const a = [];
      for (let dnum = 1; dnum <= dim; dnum++) { a.push(fmtDate(new Date(y, mo, dnum))); }
      return a;
    })();
    const list = DB.records.filter((r) => days.includes(r.date));
    const byDay = {};
    list.forEach((r) => { byDay[r.date] = (byDay[r.date] || 0) + 1; });
    const bars = days.map((d) => {
      const c = byDay[d] || 0;
      const dayLabel = isWeek ? WEEK[new Date(d + 'T00:00:00').getDay()] : String(Number(d.slice(8, 10)));
      const ctxLabel = isWeek ? ('周' + dayLabel) : d.slice(5);
      return { date: d, day: dayLabel, count: c, h: Math.max(8, Math.min(80, c * 34)), hot: c >= 2, tipLabel: ctxLabel + ' · ' + c + '次' };
    });
    const total = list.length;
    const durList = list.filter((r) => r.durationSec > 0);
    const avgSec = durList.length ? durList.reduce((s, r) => s + r.durationSec, 0) / durList.length : 0;
    const ideal = list.filter((r) => r.bristolType === 4).length;
    const dist = BRISTOL.map((b) => {
      const c = list.filter((r) => r.bristolType === b.type).length;
      return { ...b, count: c, pct: total ? Math.round(c / total * 100) : 0, color: BRISTOL_COLORS[b.type] };
    });
    const symMap = {};
    list.forEach((r) => r.symptomTags.forEach((t) => { symMap[t] = (symMap[t] || 0) + 1; }));
    const symptoms = Object.keys(symMap).map((k) => ({ name: k, count: symMap[k] })).sort((a, b) => b.count - a.count).slice(0, 5);
    return { total, avgPerDay: (total / (isWeek ? 7 : new Date(new Date().getFullYear(), new Date().getMonth() + 1, 0).getDate())).toFixed(1), avgDur: avgSec ? (avgSec / 60).toFixed(1) + ' 分钟' : '—', idealPct: total ? Math.round(ideal / total * 100) + '%' : '0%', bars, dist, symptoms };
  },
  statsPeriod: 'week',

  // 分享卡按需生成：未生成→按钮；生成中→loading；已生成→卡片
  shareBlockHtml() {
    if (!this.shareReady) {
      if (this.generating) {
        return '<div class="gen-loading"><div class="spinner"></div><div class="gen-loading-text">正在生成专属分享卡…</div></div>';
      }
      return '<button class="btn-gen" onclick="App.generateShare()"><span class="btn-gen-ico">🖼️</span>生成周报分享卡</button>';
    }
    return '<div class="card share share-fade"><div class="card-title"><span class="sec-ico">🖼️</span>本周分享卡</div>' +
      '<canvas id="shareCanvas" class="share-canvas"></canvas>' +
      '<button class="btn-save" onclick="App.saveReportCard()">保存图片到相册</button></div>';
  },
  // 点击生成：先显示 loading，短暂停顿后再绘制并淡入，体验顺滑
  generateShare() {
    if (this.shareReady || this.generating) return;
    this.generating = true;
    this.render();
    setTimeout(() => {
      this.generating = false;
      this.shareReady = true;
      this.render();
      const page = document.getElementById('page');
      if (page) page.scrollTop = page.scrollHeight;
    }, 480);
  },
  saveReportCard() {
    const el = document.getElementById('shareCanvas');
    if (!el) return;
    try {
      const url = el.toDataURL('image/png');
      const a = document.createElement('a');
      a.href = url; a.download = '肠道周报.png'; a.click();
      toast('已生成分享卡（演示下载）');
    } catch (e) { toast('生成失败'); }
  },

  switchPeriod(p) { this.statsPeriod = p; this.render(); },

  /* ================= 广场 ================= */
  renderCommunity() {
    const d = this.homeData();

      '<div class="community-hero"><div class="big">🎉</div>' +
        '<div class="t">本周打卡 ' + d.weekTotal + ' 次</div>' +
        '<div class="s">连续 ' + d.streak + ' 天 · 肠道规律看得见</div>' +
        '<button class="btn-primary" style="margin-top:14px;background:#fff;color:#2E9E4F" onclick="App.share()">把战绩分享给好友</button></div>' +
      '<div class="card" onclick="App.comingSoon()"><div class="card-title">🏆 好友打卡排行榜</div>' +
        '<div class="card-sub">和朋友一起比拼连续打卡天数</div><span style="float:right;color:#C7C7CC;font-size:20px">›</span></div>' +
      '<div class="card" onclick="App.comingSoon()"><div class="card-title">🌱 肠道知识科普</div>' +
        '<div class="card-sub">便秘、腹泻、饮食调理实用指南</div><span style="float:right;color:#C7C7CC;font-size:20px">›</span></div>' +
      '<div class="card" onclick="App.comingSoon()"><div class="card-title">🧪 趣味肠道测试</div>' +
        '<div class="card-sub">测测你的肠道年龄与健康指数</div><span style="float:right;color:#C7C7CC;font-size:20px">›</span></div>' +
      '<div class="card" style="background:#EAF6EC;text-align:center" onclick="App.go(\'record\')">' +
        '<span style="color:#2E9E4F;font-size:13px;font-weight:600">还没有记录？现在开始你的第一条 ›</span></div>';
  },
  comingSoon() { toast('该功能即将上线，敬请期待'); },

  /* ================= 我的 ================= */
  renderProfile() {
    const u = DB.users;
    const d = this.homeData();
    const todayCount = d.todayCount;
    return '' +
      '<div class="card flat"><div class="profile-head">' +

          '<div class="mini-stat"><div class="n">' + u.totalRecords + '</div><div class="l">累计记录</div></div>' +
          '<div class="mini-stat"><div class="n">' + todayCount + '</div><div class="l">今日</div></div>' +
        '</div></div>' +
      '<div class="card flat">' +
        '<div class="cell-row" onclick="App.push(\'guide\')"><span class="cell-label">新手引导</span><span class="cell-value">›</span></div>' +
        '<div class="cell-row" onclick="App.push(\'remind\')"><span class="cell-label">提醒设置</span><span class="cell-value">›</span></div>' +
        '<div class="cell-row" onclick="App.push(\'history\')"><span class="cell-label">历史记录</span><span class="cell-value">›</span></div>' +
        '<div class="cell-row" onclick="App.share()"><span class="cell-label">分享给好友</span><span class="cell-value">›</span></div>' +
        '<div class="cell-row" onclick="App.confirmReset()"><span class="cell-label">重置演示数据</span><span class="cell-value">›</span></div>' +
        '<div class="cell-row" onclick="App.about()"><span class="cell-label">关于与免责声明</span><span class="cell-value">›</span></div>' +
      '</div>';
  },
  editProfile() {
    openModal('编辑资料', '<input type="text" id="mp-nick" placeholder="输入昵称" value="' + DB.users.nickname + '">', [
      { text: '取消', cls: 'cancel' },
      { text: '保存', cls: 'ok', onClick: () => {
        const v = document.getElementById('mp-nick').value.trim() || '我';
        DB.users.nickname = v;

  confirmReset() {
    openModal('重置演示数据', '将清空所有演示记录并重新生成近 7 天数据。', [
      { text: '取消', cls: 'cancel' },
      { text: '重置', cls: 'danger', onClick: () => { resetDB(); toast('已重置'); this.render(); } }
    ]);
  },
  about() {
    openModal('关于「嗯嗯日记」', '本小程序用于个人排便健康记录与习惯参考，所有数据仅作记录与趋势展示，不构成任何医疗建议。如有身体不适，请及时就医。', [
      { text: '知道了', cls: 'ok' }
    ]);
  },

  /* ================= 历史 ================= */
  renderHistory() {
    const sorted = DB.records.slice().sort((a, b) => b.timestamp - a.timestamp);
    // 按月份分组：key = 'YYYY-MM'
    const monthMap = {};
    const yearSet = {};
    sorted.forEach((r) => {
      const m = (r.date || '').slice(0, 7);
      if (!m) return;
      yearSet[m.slice(0, 4)] = true;
      (monthMap[m] = monthMap[m] || []).push(r);
    });
    const months = Object.keys(monthMap).sort().reverse();
    const years = ['全部'].concat(Object.keys(yearSet).sort().reverse());
    const sel = this.historyYear; // null = 全部

    if (!months.length) return '<div class="empty" style="padding:80px 0">📖 还没有记录，快去打卡吧</div>';

    const groups = months.map((m) => {
      const [y, mo] = m.split('-');
      return { key: m, year: y, mLabel: Number(mo) + '月', label: y + '年' + Number(mo) + '月', items: monthMap[m] };
    });
    const filtered = sel
      ? groups.filter((g) => g.year === sel).map((g) => ({ ...g, label: g.mLabel }))
      : groups;
    const total = filtered.reduce((s, g) => s + g.items.length, 0);

    const yearBar = '<div class="hist-years">' + years.map((y) =>
      '<span class="hist-year ' + ((sel || '全部') === y ? 'on' : '') + '" onclick="App.setHistoryYear(\'' + (y === '全部' ? '' : y) + '\')">' + y + '</span>').join('') + '</div>';

    const groupsHtml = filtered.map((g) => {
      const collapsed = this.historyCollapsed[g.key];
      const rows = collapsed ? '' : g.items.map((r) =>
        '<div class="list-row" onclick="App.showDetail(\'' + r.id + '\')">' +
        '<span class="row-time">' + r.time + '</span>' +
        '<div class="row-body"><span class="row-bristol">' + r.bristolType + ' 型</span>' +
        '<span class="row-dur">' + durText(r.durationSec) + '</span></div>' +
        '<span class="row-arrow">›</span></div>').join('');
      return '<div class="list-group' + (collapsed ? ' collapsed' : '') + '">' +
        '<div class="group-head" onclick="App.toggleHistoryGroup(\'' + g.key + '\')">' +
        '<span class="group-date">' + g.label + '</span>' +
        '<span class="group-right"><span class="group-count">' + g.items.length + ' 次</span>' +
        '<span class="group-toggle' + (collapsed ? ' collapsed' : '') + '"></span></span></div>' +
        rows + '</div>';
    }).join('');

    return yearBar +
      '<div class="hist-total">共 ' + total + ' 条记录</div>' +
      '<div class="hist-list">' + groupsHtml + '<div class="list-bottom">没有更多了</div></div>';
  },
  setHistoryYear(y) { this.historyYear = y || null; this.render(); },
  toggleHistoryGroup(key) { this.historyCollapsed[key] = !this.historyCollapsed[key]; this.render(); },
  showDetail(id) {
    const r = DB.records.find((x) => x.id === id);
    if (!r) return;
    const b = BRISTOL.find((x) => x.type === r.bristolType);
    const bc = (b && BRISTOL_COLORS[b.type]) || '#34C759';
    const tags = (r.symptomTags && r.symptomTags.length)
      ? r.symptomTags.map((t) => '<span class="d-tag">' + t + '</span>').join('')
      : '<span class="d-empty">无</span>';
    const note = r.note ? '<div class="d-note">' + esc(r.note) + '</div>' : '<div class="d-note d-empty">无备注</div>';
    const body =
      '<div class="d-hero" style="background:' + bc + '18">' +
        '<div class="d-badge" style="background:' + bc + '">' + r.bristolType + '</div>' +
        '<div class="d-hero-info"><div class="d-name">' + (b ? b.name : '未知') + '</div>' +
        '<div class="d-desc">' + (b ? b.desc : '') + '</div></div>' +
      '</div>' +
      '<div class="d-when">' + r.date + ' ' + r.time + '</div>' +
      '<div class="d-grid">' +
        '<div class="d-cell"><span>时长</span><b>' + durText(r.durationSec) + '</b></div>' +
        '<div class="d-cell"><span>量</span><b>' + (r.amount || '未记录') + '</b></div>' +
        '<div class="d-cell"><span>颜色</span><b>' + (r.color || '未记录') + '</b></div>' +
        '<div class="d-cell"><span>心情</span><b>' + (r.mood || '未记录') + '</b></div>' +
      '</div>' +
      '<div class="d-sec"><div class="d-sec-title">症状</div><div class="d-tags">' + tags + '</div></div>' +
      '<div class="d-sec"><div class="d-sec-title">备注</div>' + note + '</div>';
    openModal('记录详情', body, [
      { text: '删除', cls: 'danger', onClick: () => {
        DB.records = DB.records.filter((x) => x.id !== id);
        DB.users.totalRecords = DB.records.length;
        saveDB(); toast('已删除'); this.render();
      } },
      { text: '关闭', cls: 'ok' }
    ]);
  },

  /* ================= 提醒 ================= */
  renderRemind() {
    const r = DB.reminders;
    const days = [1, 2, 3, 4, 5, 6, 0].map((k) =>
      '<div class="day-chip ' + (r.repeatDays.includes(k) ? 'on' : '') + '" onclick="App.toggleDay(' + k + ')">' + WEEK[k] + '</div>').join('');
    return '' +
      '<div class="card flat">' +
        '<div class="cell-row"><span class="cell-label">开启提醒</span>' +
        '<div class="switch ' + (r.enabled ? 'on' : '') + '" onclick="App.remindSwitch()"><div class="knob"></div></div></div>' +
        '<div class="cell-row"><span class="cell-label">提醒时间</span>' +
        '<input type="time" value="' + r.time + '" style="width:110px;text-align:right" onchange="App.remindTime=this.value"></div>' +
      '</div>' +
      '<div class="card flat"><div class="card-title" style="margin-bottom:12px">重复周期</div>' +
        '<div class="days">' + days + '</div></div>' +
      '<div class="card flat"><div class="card-title" style="margin-bottom:8px">推送方式</div>' +
        '<div class="card-sub">提醒将通过微信「服务通知」推送（演示版仅保存设置）。</div></div>' +
      '<button class="btn-primary" onclick="App.saveRemind()">保存设置</button>' +
      '<div class="note">⚠️ 演示版提醒仅保存在本地，正式版需接入微信订阅消息。</div>';
  },
  remindTime: '08:00',
  remindSwitch() { DB.reminders.enabled = !DB.reminders.enabled; saveDB(); this.render(); },
  toggleDay(k) {
    const i = DB.reminders.repeatDays.indexOf(k);
    i > -1 ? DB.reminders.repeatDays.splice(i, 1) : DB.reminders.repeatDays.push(k);
    saveDB(); this.render();
  },
  saveRemind() {
    DB.reminders.time = this.remindTime || DB.reminders.time;
    saveDB();
    toast('已保存');
    this.back();
  },

  /* ================= 引导 ================= */
  guideActive: 4,
  faqOpen: 0,
  renderGuide() {
    const bristolHtml = BRISTOL.map((b) =>
      '<div class="guide-item" onclick="App.guideActive=' + b.type + ';App.render()">' +
      '<div class="g-badge">' + b.type + '</div><div class="g-info"><div class="g-name">' + b.name + '</div>' +
      (this.guideActive === b.type ? '<div class="g-desc">' + b.desc + '</div>' : '') + '</div>' +
      '<span class="g-arrow">›</span></div>').join('');
    const faq = [
      { q: '为什么要记录排便？', a: '排便习惯是肠道健康的晴雨表。连续记录可以发现频率、形态、时间的变化规律，及时察觉异常。' },
      { q: 'Bristol 分型是什么？', a: '医学上常用的粪便形态分类（1-7 型）。4 型是理想状态；1-2 型偏便秘，6-7 型偏腹泻。' },
      { q: '多久一次算正常？', a: '正常范围是每天 3 次到每周 3 次，个体差异大。更重要的是你自己的规律是否稳定。' },
      { q: '数据会泄露吗？', a: '记录默认仅自己可见（云数据库「仅创建者可读写」），分享的内容才对外可见。' },
      { q: '这是医疗建议吗？', a: '不是。本小程序仅作记录与参考，不构成诊断或治疗建议。持续异常请及时就医。' }
    ];
    const faqHtml = faq.map((f, i) =>
      '<div class="faq-item"><div class="faq-q" onclick="App.faqOpen=' + i + ';App.render()">' +
      '<span>' + f.q + '</span><span style="color:#C7C7CC">' + (this.faqOpen === i ? '▾' : '▸') + '</span></div>' +
      (this.faqOpen === i ? '<div class="faq-a">' + f.a + '</div>' : '') + '</div>').join('');
    return '' +
      '<div class="card flat" style="background:#34C759;color:#fff;text-align:center">' +
        '<div style="font-size:17px;font-weight:700">看懂你的每一次「嗯嗯」</div>' +
        '<div style="font-size:12px;opacity:.85;margin-top:6px">3 分钟学会用 Bristol 分型读懂肠道信号</div>' +
        '<button class="btn-primary" style="margin-top:14px;background:#fff;color:#2E9E4F" onclick="App.go(\'record\')">去记录一次</button></div>' +
      '<div class="card flat"><div class="card-title" style="margin-bottom:6px">Bristol 大便分型（1-7）</div>' + bristolHtml + '</div>' +
      '<div class="card flat"><div class="card-title" style="margin-bottom:6px">常见问题</div>' + faqHtml + '</div>' +
      '<div class="note">⚠️ 本小程序数据仅作记录与参考，不构成医疗建议。持续异常请及时就医。</div>';
  }
};

/* ================= 辅助函数 ================= */
function calcStreak() {
  const set = new Set(DB.records.map((r) => r.date));
  let cur = new Date(); cur.setHours(0, 0, 0, 0);
  if (!set.has(fmtDate(cur))) cur = new Date(cur.getTime() - 86400000);
  let n = 0;
  while (set.has(fmtDate(cur))) { n++; cur = new Date(cur.getTime() - 86400000); }
  return n;
}
function fmtGroup(date) {
  const d = new Date(date + 'T00:00:00');
  return Number(date.slice(5, 7)) + '月' + Number(date.slice(8, 10)) + '日 周' + WEEK[d.getDay()];
}
function avatarHtml() {
  const u = DB.users;
  return u.avatarUrl ? '<img src="' + u.avatarUrl + '">' : u.nickname[0];
}

App.init();
</script>
